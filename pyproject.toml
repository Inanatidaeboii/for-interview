[project]
name = "segagent"
version = "0.1.0"
description = "SAM 3 segmentation tools driven by an LLM agent (Gemma 4)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=5.0",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "pycocotools",
    "openai",
    "python-dotenv",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
